<!DOCTYPE html>
{% load static %}
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت ناموفق</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 420px;
            width: 100%;
            padding: 48px 40px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon i {
            font-size: 32px;
            color: white;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 32px;
            background: #1a1a1a;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            width: 100%;
        }

        .btn:hover {
            background: #333;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #1a1a1a;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="icon">
        <i class="fas fa-xmark"></i>
    </div>

    <div class="title">پرداخت ناموفق</div>
    <div class="desc">{{ message|default:"متاسفانه پرداخت شما با مشکل مواجه شد" }}</div>

    <a href="{% url 'main:index' %}" class="btn">
        <i class="fas fa-home"></i> بازگشت به صفحه اصلی
    </a>
    <a href="javascript:history.back()" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> تلاش مجدد
    </a>

</div>

</body>
</html>

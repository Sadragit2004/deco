<!-- ============================================================
     اسکریپت موزیک پلیر
============================================================ -->
<script>
(function () {
    'use strict';

    // المنت‌ها
    const audio        = document.getElementById('miniAudio');
    const cover        = document.getElementById('miniCover');
    const titleEl      = document.getElementById('miniTitle');
    const artistEl     = document.getElementById('miniArtist');
    const playBtn      = document.getElementById('miniPlay');
    const prevBtn      = document.getElementById('miniPrev');
    const nextBtn      = document.getElementById('miniNext');
    const listEl       = document.getElementById('miniMusicList');
    const progressEl   = document.getElementById('miniProgress');
    const progressFill = document.getElementById('miniProgressFill');
    const toggleBtn    = document.getElementById('miniMusicToggle');
    const bodyEl       = document.getElementById('miniMusicBody');

    // حالت
    let musics = [];
    let currentIndex = -1;
    let isLoaded = false;

    // ========== بارگذاری لیست فقط یک بار ==========
    async function loadMusics() {
        if (isLoaded) return;
        try {
            const res = await fetch('/api/musics/');
            const data = await res.json();

            if (!data.success || !data.musics || !data.musics.length) {
                listEl.innerHTML = '<div class="mini-music-empty">هیچ آهنگی موجود نیست</div>';
                isLoaded = true;
                return;
            }

            musics = data.musics;
            renderList();
            isLoaded = true;
        } catch (err) {
            console.error('Music load error:', err);
            listEl.innerHTML = '<div class="mini-music-empty">خطا در بارگذاری</div>';
        }
    }

    // ========== رندر لیست ==========
    function renderList() {
        const frag = document.createDocumentFragment();

        musics.forEach((m, i) => {
            const item = document.createElement('div');
            item.className = 'mini-music-item';
            item.dataset.index = i;

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = m.cover || '/media/images/nophoto.png';
            img.alt = m.title;

            const info = document.createElement('div');
            info.className = 'mini-music-item-info';

            const t = document.createElement('div');
            t.className = 'mini-music-item-title';
            t.textContent = m.title;

            const a = document.createElement('div');
            a.className = 'mini-music-item-artist';
            a.textContent = m.artist;

            info.appendChild(t);
            info.appendChild(a);

            const icon = document.createElement('i');
            icon.className = 'fas fa-play';

            item.appendChild(img);
            item.appendChild(info);
            item.appendChild(icon);

            item.addEventListener('click', () => playIndex(i));

            frag.appendChild(item);
        });

        listEl.innerHTML = '';
        listEl.appendChild(frag);
    }

    // ========== پخش بر اساس ایندکس ==========
    function playIndex(index) {
        if (index < 0 || index >= musics.length) return;

        // ذخیره‌ی قبلی متوقف بشه
        if (currentIndex === index && !audio.paused) {
            audio.pause();
            return;
        }

        currentIndex = index;
        const m = musics[index];

        audio.src = m.audio_file;
        audio.load();

        cover.src = m.cover || '/media/images/nophoto.png';
        titleEl.textContent = m.title;
        artistEl.textContent = m.artist;

        audio.play().catch(err => console.warn('Play error:', err));

        // آپدیت UI لیست
        document.querySelectorAll('.mini-music-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
            const ic = el.querySelector('i');
            if (ic) ic.className = (i === index) ? 'fas fa-volume-up' : 'fas fa-play';
        });
    }

    // ========== دکمه پخش ==========
    playBtn.addEventListener('click', () => {
        if (currentIndex === -1) {
            if (musics.length) playIndex(0);
            return;
        }
        if (audio.paused) {
            audio.play().catch(err => console.warn(err));
        } else {
            audio.pause();
        }
    });

    // ========== بعدی/قبلی ==========
    nextBtn.addEventListener('click', () => {
        if (!musics.length) return;
        playIndex((currentIndex + 1) % musics.length);
    });

    prevBtn.addEventListener('click', () => {
        if (!musics.length) return;
        playIndex((currentIndex - 1 + musics.length) % musics.length);
    });

    // ========== آپدیت آیکن پخش ==========
    audio.addEventListener('play', () => {
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
    });

    audio.addEventListener('pause', () => {
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
    });

    // ========== پیشرفت ==========
    audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const p = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = p + '%';
    });

    // ========== پایان آهنگ → بعدی ==========
    audio.addEventListener('ended', () => {
        if (musics.length > 1) {
            playIndex((currentIndex + 1) % musics.length);
        } else {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            progressFill.style.width = '0%';
        }
    });

    // ========== کلیک روی نوار پیشرفت ==========
    progressEl.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressEl.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        audio.currentTime = ratio * audio.duration;
    });

    // ========== باز/بسته کردن ==========
    toggleBtn.addEventListener('click', () => {
        bodyEl.classList.toggle('collapsed');
        const icon = toggleBtn.querySelector('i');
        icon.className = bodyEl.classList.contains('collapsed')
            ? 'fas fa-chevron-up'
            : 'fas fa-chevron-down';
    });

    // ========== اولین بار که پنل باز می‌شه، لود کن ==========
    const profileTrigger = document.getElementById('profileTriggerTop');
    if (profileTrigger) {
        profileTrigger.addEventListener('click', () => {
            loadMusics();
        }, { once: true });
    }

    // اگه پنل از قبل بازه، هم لود کن (احتیاط)
    if (document.getElementById('profilePanel')?.classList.contains('open')) {
        loadMusics();
    }

})();
</script>
